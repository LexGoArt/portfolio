/* строка таблицы — было style-hover в исходнике */
.row:hover{background:#FAF8F1}

/* ── экран выбора языка ── */
#gate{position:fixed;inset:0;z-index:9999;background:#F7F5EF;display:flex;align-items:center;justify-content:center;padding:24px}
#gate[hidden]{display:none}
.gate-card{max-width:520px;width:100%;text-align:center}

.gate-sub{font:500 13.5px/1.5 'Manrope',sans-serif;color:#8A867C;margin:0 0 30px}
.gate-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gate-btn{appearance:none;cursor:pointer;background:#fff;border:1px solid #E3DFD3;border-radius:999px;

  transition:background .18s ease,border-color .18s ease,transform .18s ease}
.gate-btn:hover{background:#1C1C1E;border-color:#1C1C1E;color:#F7F5EF;transform:translateY(-2px)}
.gate-btn:focus-visible{outline:2px solid #C75B39;outline-offset:3px}
.gate-foot{font:500 11.5px 'JetBrains Mono',monospace;color:#B5B1A5;margin-top:26px}

/* ── переключатель языка ── */
#lang{position:fixed;right:20px;bottom:20px;z-index:900;display:flex;gap:2px;
  background:#fff;border:1px solid #E3DFD3;border-radius:999px;padding:4px;
  box-shadow:0 6px 20px rgba(28,28,30,0.10)}
#lang[hidden]{display:none}
#lang button{appearance:none;cursor:pointer;background:none;border:0;border-radius:999px;
  padding:7px 13px;font:700 12px 'JetBrains Mono',monospace;color:#8A867C;
  transition:background .15s ease,color .15s ease}
#lang button:hover{color:#1C1C1E}
#lang button[aria-current="true"]{background:#1C1C1E;color:#F7F5EF}
#lang button:focus-visible{outline:2px solid #C75B39;outline-offset:2px}
@media print{#lang,#gate{display:none !important}}

/* содержимое скрыто, пока язык не выбран */
#doc[hidden]{display:none}

/* ══════════════════════════════════════════════════════════════
   Мобильная адаптация.
   Вся вёрстка документа — на инлайновых style, поэтому переопределяем
   через !important, но ТОЧЕЧНО: только те свойства, что реально меняются.
   font-size отдельной строкой, а не через шорткод font — иначе слетит
   семейство и вес. Десктоп (>=900px) ни одним правилом не затронут.
   ══════════════════════════════════════════════════════════════ */

/* подсказка к таблице — только на узких экранах */
.table-hint{display:none;font:600 11.5px 'Manrope',sans-serif;color:#8A867C;margin:0 0 8px}

@media (max-width:899px){

}

@media (max-width:680px){

  .kpi-num--1{font-size:58px !important}
  .kpi-num--2{font-size:44px !important}

  .risk-aside{border-right:0 !important;border-bottom:1px solid #3A3A3C !important;

  .risk-aside-num{font-size:44px !important}

  /* три карточки риска: в столбик, стрелки разворачиваются вниз */
  .risk-cards{flex-direction:column !important;gap:8px !important}
  .risk-arrow{align-self:flex-start !important;transform:rotate(90deg) !important;margin-left:12px !important}

  /* обе сетки по 4 колонки → одна */
  .grid4{grid-template-columns:1fr !important;gap:18px !important}
  .grid4--biz > div{border-left:0 !important;padding-left:0 !important;margin-left:0 !important}
  .stat-num{font-size:32px !important}

  /* пилюли: снимаем nowrap — польские строки длиннее английских */
  .pill-grid{grid-template-columns:1fr !important;gap:8px !important}
  .pill{white-space:normal !important;justify-content:flex-start !important;text-align:left !important}

  /* Полосы времени. В один столбец было нечитаемо: сумма справа висела
     сама по себе, глаз не связывал её ни с названием, ни со сроком.
     Теперь пары — слева кто, справа сколько и как долго, полоса под ними.
     Порядок детей в разметке: 1 имя+часы, 2 полоса, 3 сумма, 4 срок. */
  .bar-row{grid-template-columns:1fr auto !important;align-items:start !important;
           gap:2px 18px !important;padding:18px 0 !important}
  .bar-row > div:nth-child(1){grid-column:1;grid-row:1 / span 2}
  .bar-row > div:nth-child(3){grid-column:2;grid-row:1;text-align:right}
  .bar-row > div:nth-child(4){grid-column:2;grid-row:2;text-align:right;
           border-left:0 !important;padding-left:0 !important}
  .bar-row > div:nth-child(2){grid-column:1 / -1;grid-row:3;margin-top:12px}

  /* переключатель языка фиксирован снизу — не должен накрывать финальную фразу */
  .doc-wrap{padding-bottom:96px !important}

    <div class="table-hint" data-i="tblScroll"></div>
    <div class="table-scroll" style="border:1px solid #E3DFD3;border-radius:6px;overflow-x:auto;background:#fff">
      <!-- 922px = точная сумма колонок 40+300+112+120+192+158. При 880px
           фон шапки не докрашивался на 42px справа под колонкой «Удалённо». -->
      <div class="table-inner" style="min-width:922px">
      <div class="table-row table-head" style="position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px minmax(300px,1fr) 112px 120px 192px 158px;background:#1C1C1E;color:#F7F5EF">
        <div></div>
        <div data-i="thTask" style="padding:12px 16px 12px 0;font:700 12px 'Manrope',sans-serif;letter-spacing:0.02em"></div>
        <div style="padding:12px 14px;background:#B85C3E;text-align:right"><div data-i="thAi" style="font:700 12px 'Manrope',sans-serif"></div><div data-i="thAiSub" style="font:500 10px 'JetBrains Mono',monospace;color:#F3D2BE;margin-top:2px"></div></div>
        <div style="padding:12px 14px;text-align:right"><div data-i="thSelf" style="font:700 12px 'Manrope',sans-serif"></div><div data-i="thSelfSub" style="font:500 10px 'JetBrains Mono',monospace;color:#9C998F;margin-top:2px"></div></div>
        <div style="padding:12px 14px;text-align:right;border-left:1px solid #33322F"><div data-i="thOff" style="font:700 12px 'Manrope',sans-serif"></div><div data-i="thOffSub" style="font:500 10px 'JetBrains Mono',monospace;color:#9C998F;margin-top:2px"></div></div>
        <div style="padding:12px 14px;text-align:right;border-left:1px solid #33322F"><div data-i="thRem" style="font:700 12px 'Manrope',sans-serif"></div><div data-i="thRemSub" style="font:500 10px 'JetBrains Mono',monospace;color:#9C998F;margin-top:2px"></div></div>
      </div>
      <div id="rows"></div>
      <div class="table-row table-foot" style="display:grid;grid-template-columns:40px minmax(300px,1fr) 112px 120px 192px 158px;border-top:2px solid #1C1C1E;background:#fff">
        <div></div>
        <div data-i="totLabel" style="padding:16px 16px 16px 0;font:800 13px 'Manrope',sans-serif;letter-spacing:0.05em;text-transform:uppercase;align-self:center"></div>
        <div style="padding:14px 14px;text-align:right;background:#FBEDE4;border-left:1px solid #F0D9C8;border-right:1px solid #F0D9C8">
          <div data-i="totAiH" style="font:700 19px/1.2 'JetBrains Mono',monospace;letter-spacing:-0.02em;color:#B85C3E;white-space:nowrap"></div>
          <div data-i="totAiZ" style="font:600 11.5px 'JetBrains Mono',monospace;color:#C08163;margin-top:2px"></div>
        </div>
        <div style="padding:14px 14px;text-align:right">
          <div data-i="totSelfZ" style="font:700 17px/1.2 'JetBrains Mono',monospace;letter-spacing:-0.02em"></div>
          <div data-i="totSelfH" style="font:600 11.5px 'JetBrains Mono',monospace;color:#B85C3E;margin-top:2px"></div>
          <div data-i="totSelfX" style="font:600 10.5px 'Manrope',sans-serif;color:#B85C3E;margin-top:4px;white-space:nowrap"></div>
        </div>
        <div style="padding:14px 14px;text-align:right;border-left:1px solid #EFECE2">
          <div data-i="totOffZ" style="font:700 17px/1.2 'JetBrains Mono',monospace;letter-spacing:-0.02em"></div>
          <div data-i="totOffH" style="font:600 11.5px 'JetBrains Mono',monospace;color:#B85C3E;margin-top:2px"></div>
          <div data-i="totOffX" style="font:600 10.5px 'Manrope',sans-serif;color:#B85C3E;margin-top:4px;white-space:nowrap"></div>
        </div>
        <div style="padding:14px 14px;text-align:right;border-left:1px solid #EFECE2">
          <div data-i="totRemZ" style="font:700 17px/1.2 'JetBrains Mono',monospace;letter-spacing:-0.02em"></div>
          <div data-i="totRemH" style="font:600 11.5px 'JetBrains Mono',monospace;color:#B85C3E;margin-top:2px"></div>
          <div data-i="totRemX" style="font:600 10.5px 'Manrope',sans-serif;color:#B85C3E;margin-top:4px;white-space:nowrap"></div>
        </div>
      </div>
      </div>
    </div>
    <div data-i="tblNote" style="font:500 11.5px/1.55 'Manrope',sans-serif;color:#8A867C;margin-top:10px;max-width:860px"></div>
  </section>

  <section style="margin-top:64px">
    <h2 data-i="timeTitle" style="font:800 24px 'Manrope',sans-serif;letter-spacing:-0.01em;margin:0 0 4px"></h2>
    <div data-i="timeSub" style="font:500 12.5px 'Manrope',sans-serif;color:#8A867C;margin-bottom:24px"></div>
    <div id="bars"></div>
  </section>

  <footer class="closing" style="margin-top:72px;padding-top:28px;border-top:2px solid #1C1C1E">
    <div data-ih="footBig" style="font:800 26px/1.3 'Manrope',sans-serif;letter-spacing:-0.01em;margin-bottom:12px"></div>
    <div data-ih="footSmall" style="font:500 11.5px/1.65 'JetBrains Mono',monospace;color:#A8A49A"></div>
  </footer>

</div>
</div>

<script src="i18n.js"></script>
<script>
(function () {
  var STORE = 'aivs-lang';
  var BAR_W = ['3.7%', '48.1%', '55%', '100%'];
  var BAR_C = ['#C75B39', '#1C1C1E', '#1C1C1E', '#1C1C1E'];
  var ROW_CSS = 'display:grid;grid-template-columns:40px minmax(300px,1fr) 112px 120px 192px 158px;border-bottom:1px solid #EFECE2;align-items:stretch';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Своя группировка: Intl для pl-PL не разделяет 4-значные числа,
  // из-за чего в одной колонке соседствовали «3400» и «11 148».
  function fz(n, L) {
    var sep = L === 'en' ? ',' : ' ';
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  }
  // В польском «godz.» не влезает в колонку 112px («16 godz.» рвётся на
  // две строки), поэтому в числовых колонках — символ «h».
  function fh(n, L) {
    var s = L === 'en' ? String(n) : String(n).replace('.', ',');
    return s + (L === 'ru' ? ' ч' : ' h');
  }

  function renderRows(L) {
    var T = window.I18N[L], TX = window.TASK_TEXT[L], out = [];
    for (var i = 0; i < window.TASK_NUMS.length; i++) {
      var d = window.TASK_NUMS[i];               // [n, aiH, aiZl, selfH, selfZl, offH, offZl, remZl]
      var tech = window.TASK_TECH[i], rw = window.TASK_REMW[i], rs = window.TASK_REMS[i];
      var split = tech > 0
        ? T.unitWork + ' ' + fz(d[6] - tech, L) + ' + ' + T.unitTech + ' ' + fz(tech, L)
        : '';
      var remH = rs > 0
        ? fh(rw, L) + ' + ' + fh(rs, L) + ' ' + T.unitSearch
        : fh(rw, L);
      out.push(
        '<div id="task-' + d[0] + '" class="row table-row" style="' + ROW_CSS + '">' +
          '<div style="padding:10px 0 10px 12px;font:500 11px \'JetBrains Mono\',monospace;color:#B5B1A5">' +
            (d[0] < 10 ? '0' + d[0] : d[0]) + '</div>' +
          '<div style="padding:9px 16px 9px 0">' +
            '<div style="font:600 14px/1.35 \'Manrope\',sans-serif">' + esc(TX[i][0]) + '</div>' +
            '<div style="font:500 11.5px/1.3 \'Manrope\',sans-serif;color:#9C988C;margin-top:2px">' + esc(TX[i][1]) + '</div>' +
          '</div>' +
          '<div style="padding:8px 14px;text-align:right;background:#FBEDE4;border-left:1px solid #F0D9C8;border-right:1px solid #F0D9C8">' +
            '<div style="font:700 20px/1.2 \'JetBrains Mono\',monospace;letter-spacing:-0.02em;color:#B85C3E">' + fh(d[1], L) + '</div>' +
            '<div style="font:600 11.5px \'JetBrains Mono\',monospace;color:#C08163;margin-top:2px">' + fz(d[2], L) + ' zł</div>' +
          '</div>' +
          '<div style="padding:8px 14px;text-align:right">' +
            '<div style="font:600 17px/1.2 \'JetBrains Mono\',monospace;letter-spacing:-0.02em;color:#1C1C1E">' + fz(d[4], L) + '</div>' +
            '<div style="font:600 11.5px \'JetBrains Mono\',monospace;color:#B85C3E;margin-top:2px">' + fh(d[3], L) + '</div>' +
          '</div>' +
          '<div style="padding:8px 14px;text-align:right;border-left:1px solid #EFECE2">' +
            '<div style="font:600 17px/1.2 \'JetBrains Mono\',monospace;letter-spacing:-0.02em;color:#1C1C1E">' + fz(d[6], L) + '</div>' +
            '<div style="font:600 11.5px \'JetBrains Mono\',monospace;color:#B85C3E;margin-top:2px">' + fh(d[5], L) + '</div>' +
            '<div style="font:500 10px \'JetBrains Mono\',monospace;color:#B5B1A5;margin-top:1px">' + esc(split) + '</div>' +
          '</div>' +
          '<div style="padding:8px 14px;text-align:right;border-left:1px solid #EFECE2">' +
            '<div style="font:600 17px/1.2 \'JetBrains Mono\',monospace;letter-spacing:-0.02em;color:#1C1C1E">' + fz(d[7], L) + '</div>' +
            '<div style="font:600 11.5px \'JetBrains Mono\',monospace;color:#B85C3E;margin-top:2px">' + esc(remH) + '</div>' +
          '</div>' +
        '</div>'
      );
    }
    document.getElementById('rows').innerHTML = out.join('');
  }

  function renderBars(L) {
    var T = window.I18N[L], out = [];
    for (var i = 0; i < 4; i++) {
      out.push(
        '<div class="bar-row" style="display:grid;grid-template-columns:190px 1fr 110px 200px;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid #E3DFD3">' +
          '<div>' +
            '<div style="font:700 14px \'Manrope\',sans-serif">' + esc(T.barNames[i]) + '</div>' +
            '<div style="font:500 11.5px \'JetBrains Mono\',monospace;color:#A8A49A;margin-top:2px">' + esc(T.barHours[i]) + '</div>' +
          '</div>' +
          '<div style="height:10px;background:#ECE9DE;border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;width:' + BAR_W[i] + ';background:' + BAR_C[i] + '"></div></div>' +
          '<div style="font:700 14px \'JetBrains Mono\',monospace;text-align:right">' + esc(T.barCosts[i]) + '</div>' +
          '<div style="font:500 12px \'JetBrains Mono\',monospace;color:#6E6A60;padding-left:14px;border-left:1px dashed #E3DFD3">' + esc(T.barTimes[i]) + '</div>' +
        '</div>'
      );
    }
    document.getElementById('bars').innerHTML = out.join('');
  }

  function apply(L) {
    var T = window.I18N[L];
    if (!T) return;
    document.documentElement.lang = T.htmlLang;
    document.title = T.docTitle;
    document.querySelectorAll('[data-i]').forEach(function (el) {
      var v = T[el.getAttribute('data-i')];
      if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-ih]').forEach(function (el) {
      var v = T[el.getAttribute('data-ih')];
      if (v !== undefined) el.innerHTML = v;
    });
    renderRows(L);
    renderBars(L);
    document.querySelectorAll('#lang button').forEach(function (b) {
      b.setAttribute('aria-current', String(b.getAttribute('data-lang') === L));
    });
    try { localStorage.setItem(STORE, L); } catch (e) {}
  }

  function reveal(L) {
    apply(L);
    document.getElementById('gate').hidden = true;
    document.getElementById('doc').hidden = false;
    document.getElementById('lang').hidden = false;
    document.body.style.overflow = '';
  }

  document.querySelectorAll('#gate .gate-btn, #lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      var L = b.getAttribute('data-lang');
      if (document.getElementById('gate').hidden) { apply(L); } else { reveal(L); }
    });
  });

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved && window.I18N[saved]) {
    reveal(saved);
  } else {
    document.body.style.overflow = 'hidden';
  }
})();
</script>
</body>
</html>
