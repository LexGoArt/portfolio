<style>
:root{
  --bg:#FFFFFF; --surface:#FAFAFA; --line:#E4E4E7; --line-soft:#F4F4F5;
  --fg:#09090B; --fg-2:#52525B; --fg-3:#8E8E96; --fg-4:#CFCFD6;
  --income:#15803D; --expense:#B91C1C; --accent:#09090B;
  --item-h:52px; --ease:cubic-bezier(.18,.9,.32,1); --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* темна тема — лише за явним перемиканням, системну не наслідуємо */
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#0F0F12; --line:#1E1E24; --line-soft:#151519;
  --fg:#FAFAFA; --fg-2:#A1A1AA; --fg-3:#5D5D68; --fg-4:#2E2E36;
  --income:#86EFAC; --expense:#FCA5A5; --accent:#FAFAFA;
}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px } /* монохромне кільце фокуса за замовчуванням */
html,body{height:100%; height:100dvh}
body{
  background:var(--bg); color:var(--fg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; font-synthesis:none; text-rendering:optimizeLegibility;
  overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:16px; padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
                max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  gap:0;
}
@media (max-height:720px){ body{justify-content:flex-start;padding-top:24px} }
/* короткі альбомні екрани (складані/старі телефони лежачи) — стискаємо ритм,
   а overflow-y:auto вище лишається підстраховкою, якщо все одно не влізе */
@media (max-height:480px){
  :root{--item-h:32px}
  body{padding-top:8px;padding-bottom:8px}
  .read{padding-bottom:4px}
  .kind{height:14px}
  .title{margin-top:2px;font-size:clamp(16px,2.8vw,24px)}
  .crumbs{margin-top:2px;line-height:1.3;min-height:0}
  .meta{margin-top:2px;min-height:0}
  .cell{font-size:17px}
  .dot{bottom:-16px;font-size:7.5px} /* --item-h менший — підпис теж підтягуємо, інакше в'їде в .code */
  .codes{margin-top:26px} .code{padding:5px 12px} /* > |dot.bottom| + висота підпису, щоб не перекривались */
  .hint{margin-top:6px;line-height:1.3}
}
/* портфоліо-обгортка додає .pfnav після .hint на вузьких екранах — лишаємо їй місце знизу */
body:has(.pfnav){padding-bottom:24px}

/* ─── читалка ─────────────────────────────────────────────── */
.read{ width:100%; max-width:760px; text-align:center; position:relative;
       padding-bottom:40px; flex-shrink:0; }
/* .picker не має «свого» контенту (усі діти — position:absolute), тому без flex-shrink:0
   на короткому viewport flex-колонка body стискає саме його в нуль, а не .read/.code/.hint —
   рядки цифр тоді вилазять за межі власного контейнера й наїжджають на код/підказку */
.code, .hint{ flex-shrink:0 }
.morph{ position:relative; }
.morph>.cur{ position:relative; z-index:2; }
.morph>.gh{ position:absolute; inset:0; z-index:1; pointer-events:none;
            animation:gh var(--gd,360ms) cubic-bezier(.16,.84,.44,1) forwards;
            will-change:opacity,filter,transform }
@keyframes gh{
  0%  {opacity:var(--go,.34); filter:blur(1.5px); transform:translateY(0) scale(1)}
  100%{opacity:0;             filter:blur(var(--gb,9px));
       transform:translateY(var(--gy,-8px)) scale(var(--gs,1.02))}
}
/* текст «збирається» з розмиття, коли барабан зупинився */
.morph>.cur.enter,
.code.enter{ animation:enter var(--ed,520ms) var(--ease) both; animation-delay:var(--edl,0ms);
             will-change:opacity,filter,transform }
@keyframes enter{
  0%  {opacity:0; filter:blur(var(--eb,6px)); transform:translateY(var(--ey,6px)) scale(.99)}
  55% {opacity:1}
  100%{opacity:1; filter:blur(0);              transform:none}
}
.kind{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:500;
       height:16px; color:var(--fg-3); }
.kind .dot{ display:inline-block;width:5px;height:5px;border-radius:50%;
            background:currentColor; vertical-align:middle; margin-right:8px; margin-bottom:2px }
.kind.inc{color:var(--income)} .kind.exp{color:var(--expense)}
.title{ font-size:clamp(22px,3.6vw,40px); font-weight:300; line-height:1.18; letter-spacing:-.018em;
        margin-top:14px; min-height:calc(1.18em * 2); display:flex; flex-direction:column; justify-content:flex-end }
.title.void{ color:var(--fg-4); font-weight:300 }
.crumbs{ margin-top:16px; font-size:13px; font-weight:400; color:var(--fg-2); line-height:1.6;
         min-height:21px }
.crumbs i{ font-style:normal; color:var(--fg-4); padding:0 7px }
.crumbs b{ font-weight:500 }
.crumbs .void{ color:var(--fg-3) }
.crumbs .near{ color:var(--fg-2); text-decoration:underline dotted; text-underline-offset:3px;
               transition:color 150ms ease }
.crumbs .near:hover,.crumbs .near:focus-visible{ color:var(--fg) }
.meta{ margin-top:10px; font-size:11.5px; color:var(--fg-2); min-height:17px;
       font-family:var(--mono); font-weight:300; letter-spacing:.01em; font-variant-numeric:tabular-nums }
       /* було --fg-3 (3.2:1) — це «істотний» текст (крихти/мета), піднято до --fg-2 (7.7:1) для 4.5:1 AA */
.flag{ font-family:Inter,sans-serif; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
       color:var(--fg-3); vertical-align:1px }
.meta i{ font-style:normal; color:var(--fg-4); padding:0 6px }
.reg{ margin-top:6px; font-size:11px; color:var(--fg-3); min-height:16px; line-height:1.5;
      font-family:var(--mono); font-weight:300; font-variant-numeric:tabular-nums }
.reg i{ font-style:normal; color:var(--fg-4); padding:0 6px }

/* ─── пікер ───────────────────────────────────────────────── */
.picker{ position:relative; max-width:100%; display:flex; align-items:stretch; gap:0;
         height:calc(var(--item-h)*5); flex-shrink:0; perspective:900px; user-select:none;
         touch-action:none; }
.lens{ position:absolute; left:-14px; right:-14px; top:calc(var(--item-h)*2); height:var(--item-h);
       border-top:1px solid var(--line); border-bottom:1px solid var(--line);
       pointer-events:none; z-index:3; }
.lens::before,.lens::after{ content:''; position:absolute; left:0; right:0; height:1px;
       background:linear-gradient(90deg,transparent,var(--fg-4),transparent); opacity:.5 }
.lens::before{top:-1px} .lens::after{bottom:-1px}
.fade{ position:absolute; left:-20px; right:-20px; pointer-events:none; z-index:4; height:calc(var(--item-h)*2) }
.fade.t{ top:0;    background:linear-gradient(var(--bg) 46%, transparent) }
.fade.b{ bottom:0; background:linear-gradient(transparent, var(--bg) 54%) }

.col{ position:relative; width:var(--w,46px); cursor:ns-resize; }
.col.wide{ --w:74px }
.col .stack{ position:absolute; inset:0; transform-style:preserve-3d; }
.col .echo{ position:absolute; inset:0; transform-style:preserve-3d; pointer-events:none;
            mix-blend-mode:normal }
.cell{ position:absolute; left:0; right:0; top:calc(50% - var(--item-h)/2); height:var(--item-h);
       display:flex; align-items:center; justify-content:center;
       font-family:var(--mono); font-size:30px; font-weight:300; letter-spacing:.01em;
       font-variant-numeric:tabular-nums; will-change:transform,opacity; backface-visibility:hidden; }
.cell.off{ color:var(--fg-3) } /* було --fg-4 (1.5:1 на білому — майже невидимо); --fg-3 ≈3.2:1 світла/≈3:1 темна */
.dot{ position:absolute; left:50%; transform:translateX(-50%); bottom:-30px;
      font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--fg-3);
      white-space:nowrap; transition:color 200ms ease }
.col.active .dot{ color:var(--fg-2) }
/* фокус з клавіатури — тонка рамка лише навколо активної цифри в лінзі, не вздовж усього стовпчика */
.col:focus-visible{ outline:none }
.col:focus-visible::after{ content:''; position:absolute; left:2px; right:2px; top:calc(var(--item-h)*2);
  height:var(--item-h); border:1px solid var(--fg-3); border-radius:6px; pointer-events:none; z-index:5 }
.col:focus-visible .dot{ color:var(--fg) }

.sep{ display:flex; align-items:center; justify-content:center; width:16px;
      font-family:var(--mono); font-size:26px; color:var(--fg-4); font-weight:300;
      padding-top:2px; position:relative; z-index:2 }
.sep.gap{ width:30px }

/* ─── низ ─────────────────────────────────────────────────── */
.code{ margin-top:0; flex-shrink:0; font-family:var(--mono); font-size:15px; font-weight:400;
       color:var(--fg-2); letter-spacing:.06em; cursor:pointer; padding:7px 14px;
       border:1px solid var(--line); border-radius:8px; background:transparent;
       font-variant-numeric:tabular-nums;
       transition:border-color 200ms var(--ease),color 200ms ease }
.code:hover{ border-color:var(--fg-4); color:var(--fg) }
.code:active{ transform:scale(.985) }
.code:focus-visible{ border-color:var(--fg-4); color:var(--fg) }
.mirror{ margin-top:0; margin-left:8px; flex-shrink:0; font-family:Inter,sans-serif; font-size:11px;
         letter-spacing:.06em; color:var(--fg-3); background:transparent; border:1px solid transparent;
         border-radius:8px; padding:8px 10px; cursor:pointer;
         transition:color 150ms ease,border-color 200ms var(--ease) }
.mirror:hover,.mirror:focus-visible{ color:var(--fg); border-color:var(--line) }
.mirror:disabled{ color:var(--fg-4); cursor:default; border-color:transparent }
.codes{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:52px; flex-shrink:0 }
.hint{ margin-top:18px; font-size:10.5px; color:var(--fg-3); letter-spacing:.06em;
       text-align:center; line-height:1.9 }
.hint .mob{display:none}
.hint kbd{ font-family:var(--mono); border:1px solid var(--line); border-radius:4px;
           padding:1px 5px; font-size:9.5px; color:var(--fg-3) }

/* ─── пошук ───────────────────────────────────────────────── */
.search{ position:fixed; inset:0; background:var(--bg); /* фолбек для Safari/Chrome без color-mix() */
         background:color-mix(in srgb,var(--bg) 88%,transparent);
         -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); z-index:50; display:none;
         flex-direction:column; align-items:center; padding:14vh 20px 20px }
.search.on{ display:flex }
.search input{ width:100%; max-width:560px; background:transparent; border:0;
    border-bottom:1px solid var(--line); color:var(--fg); font-size:22px; font-weight:300;
    font-family:Inter,sans-serif; padding:12px 2px; outline:none; transition:border-color 150ms ease }
    /* font-size:22px ≥16px навмисно — не дає Safari на iOS зумити сторінку при фокусі */
.search input::placeholder{ color:var(--fg-4) }
.search input:focus-visible{ border-bottom-color:var(--fg) }
.res{ width:100%; max-width:560px; margin-top:6px; overflow-y:auto; flex:1;
      -webkit-overflow-scrolling:touch }
.res div{ padding:12px 2px; border-bottom:1px solid var(--line-soft); cursor:pointer;
          display:flex; justify-content:space-between; gap:16px; align-items:baseline }
.res div:hover,.res div.sel{ background:var(--surface) }
.res div:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px }
.res .nm{ font-size:14px; font-weight:300; color:var(--fg) }
.res .cd{ font-family:var(--mono); font-size:11px; color:var(--fg-3); white-space:nowrap }
.res .sub{ color:var(--fg-3); font-size:11px }
.res .none{ color:var(--fg-3); font-size:13px; cursor:default; border:0; padding-top:18px }
.toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(8px);
        font-size:11.5px; letter-spacing:.06em; color:var(--fg-2); background:var(--surface);
        border:1px solid var(--line); border-radius:999px; padding:7px 16px;
        opacity:0; pointer-events:none; transition:all 260ms cubic-bezier(.33,1,.68,1) }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
@media (prefers-reduced-motion:reduce){ .morph>.gh{display:none} .morph>.cur.enter,.code.enter{animation:none} *{transition-duration:1ms!important} }
@media (max-width:620px){
  :root{--item-h:44px}
  .cell{font-size:22px} .col{--w:30px} .col.wide{--w:46px}
  .sep{width:8px;font-size:17px} .sep.gap{width:13px}
  .dot{font-size:9px;letter-spacing:.06em;bottom:-26px;opacity:0;transition:opacity 180ms ease}
  .col.active .dot{opacity:1}
  .hint .desk{display:none} .hint .mob{display:inline}
  .lens{left:-8px;right:-8px} .fade{left:-10px;right:-10px}
  .codes{margin-top:46px} .code{font-size:13px}
  .hint{font-size:9.5px;line-height:2.1}
}
@media (max-width:400px){
  :root{--item-h:40px}
  .cell{font-size:19px} .col{--w:26px} .col.wide{--w:40px}
  .sep{width:6px;font-size:14px} .sep.gap{width:10px}
  .title{font-size:21px} .crumbs{font-size:12px} .meta{font-size:10px}
}
</style>
</head>
<body>

<div class="read">
  <div class="morph kind" id="mKind"><span class="cur" id="vKind"></span></div>
  <div class="morph title" id="mTitle"><span class="cur" id="vTitle"></span></div>
  <div class="morph crumbs" id="mCrumbs"><span class="cur" id="vCrumbs"></span></div>
  <div class="morph meta" id="mMeta"><span class="cur" id="vMeta"></span></div>
</div>

<div class="picker" id="picker">
  <div class="fade t"></div><div class="lens"></div><div class="fade b"></div>
</div>

<button class="code" id="code" title="Скопіювати код">—</button>
<div class="hint">
  <span class="desk">колесо миші над розрядом &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> розряд &nbsp;·&nbsp;
  <kbd>↑</kbd><kbd>↓</kbd> значення &nbsp;·&nbsp; <kbd>/</kbd> або клік по назві — пошук &nbsp;·&nbsp; світлі цифри — код вільний</span>
  <span class="mob">тягніть розряд угору чи вниз &nbsp;·&nbsp; торкніться назви — пошук &nbsp;·&nbsp; світлі цифри — код вільний</span>
</div>

<div class="search" id="search">
  <input id="q" placeholder="Назва статті або проєкту…" autocomplete="off" spellcheck="false">
  <div class="res" id="res"></div>
</div>
<div class="toast" id="toast">код скопійовано</div>

<script src="codex.js"></script>
<script src="app.js"></script>

<nav class="pfnav" aria-label="Portfolio">

</body>
